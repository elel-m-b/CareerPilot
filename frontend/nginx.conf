# CareerPilot frontend web server.
#
# The SPA is served as static files and every /api request is forwarded to the
# Spring Boot service, so the browser always talks to one origin (no CORS and no
# absolute API URL baked into the bundle).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Re-resolving on every request (valid=10s) picks up
    # a backend container that was recreated with a new IP, without restarting
    # nginx. The variable form of proxy_pass is required for DNS re-resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # CV uploads are limited to 10 MB by the backend; nginx defaults to 1 MB.
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Content-hashed assets can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The HTML shell must always be revalidated so new builds are picked up.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA history fallback for client-side routes such as /cv/12.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
